[package]
name = "fishterm"
version = "0.1.0"
description = "FishTerm: SSH client with Cloudflare Access support. Fork of sirilerklab/FishTerm."
edition = "2024"
license = "MIT"
publish = false

[lib]
# WHY: Tauri v2 layout; the lib is reused by mobile targets and unit tests.
name = "fishterm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
base64 = "0.22"
crypto_box = "0.9"
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }
http = "1"
keyring = "4.2.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
russh = "0.65.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "sync", "time", "macros", "net", "io-util"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2"
uuid = { version = "1.29.1", features = ["v4", "serde"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
strip = true

[dev-dependencies]
tempfile = "3.27.0"
wiremock = "0.6.5"
