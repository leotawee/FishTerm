[package]
name = "meo-fishterm"
version = "0.1.0"
description = "MEO FishTerm: SSH client with Cloudflare Access support. Fork of sirilerklab/FishTerm."
edition = "2024"
license = "MIT"
publish = false

[lib]
# WHY: Tauri v2 layout; the lib is reused by mobile targets and unit tests.
name = "meo_fishterm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
keyring = "4.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = [] }
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.1", features = ["v4", "serde"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
strip = true

[dev-dependencies]
tempfile = "3.27.0"
